name: Refresh contributions

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC, roughly 2am Pacific
  workflow_dispatch:
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public contributions (no token)
        run: python3 scripts/fetch_contributions.py ${{ github.repository_owner }}
      - name: Regenerate SVGs and README
        run: python3 scripts/gen.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets data README.md
          git diff --cached --quiet || git commit -m "tide: refresh contributions [skip ci]"
          git push
